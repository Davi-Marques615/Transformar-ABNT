services:
  - type: web
    name: conversor-abnt
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: ALLOW_UNPAID_GENERATION
        value: "0"
      - key: DATABASE_PATH
        value: /var/data/abnt.sqlite3
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BASIC_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRODUCT_BASIC_MONTHLY
        value: prod_VJGhhSwol8rJ31
      - key: STRIPE_PRODUCT_BASIC_ANNUAL
        value: prod_VJGjo0XRRTBadA
      - key: STRIPE_PRODUCT_PRO_MONTHLY
        value: prod_VJGkAvEOpYNNDp
      - key: STRIPE_PRODUCT_PRO_ANNUAL
        value: prod_VJGk9CzbOm0k06
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
    disk:
      name: abnt-data
      mountPath: /var/data
      sizeGB: 1
